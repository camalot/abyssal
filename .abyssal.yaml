---
version: 1
settings:
  
  providers:
    helm:
      # selector: '.applications.{{ .Name }} | select(.chartName = "{{ .ChartName }}") | .targetRevision'
      entries: '.entries["{{ .ChartName }}"][0] | .version'
  notifiers:
    github:
      enabled: false
    slack:
      enabled: false
    discord:
      enabled: false
    email:
      enabled: false
    jira:
      enabled: false

providers:
  - name: helm
    directory: "./sample"
    selector: '.. | select(.chartName != null and .repoURL != null) | [{"chartName": .chartName, "repoURL": .repoURL, "targetRevision": .targetRevision}]'
