---
version: 1
settings:
  providers:
    argo-aoa:
      # this will only filter out pre-releases if there are artifacthub.io annotations
      entries: .entries["{{ .Name }}"] | map(select(.annotations."artifacthub.io/prerelease" != "true")) | .[0].version
      evaluator: |
        {{ .Selector }}
        | to_entries
        | .[]
        | select(.value.chartName!=null and .value.repoURL!=null and .value.targetRevision!=null)
        | [{"chartName": .value.chartName, "repoURL": .value.repoURL, "targetRevision": .value.targetRevision}]
      selector: '.sample.applications'
      assumeRepositoryURL: ''

  authentication: {}

  notifiers:
    - type: github
      enabled: false
      title: "[Abyssal] Bump {{ .Target.Name }} from v{{ .CurrentVersion }} to v{{ .ExpectedVersion }}"
      body: |
        Bump {{ .Target.Name }} from v{{ .CurrentVersion }} to v{{ .ExpectedVersion }}.
      token: "{{ .EnvironmentVariables.GITHUB_TOKEN }}"
      labels: ["abyssal"]
      organization: "{{ .EnvironmentVariables.GITHUB_ORGANIZATION }}"
      repository: "{{ .EnvironmentVariables.GITHUB_REPOSITORY_NAME }}"
    - type: slack
      enabled: false
      webhook: "{{ .EnvironmentVariables.SLACK_WEBHOOK }}"
      title: "[Abyssal] Bump {{ .Target.Name }} from v{{ .CurrentVersion }} to v{{ .ExpectedVersion }}"
      body: |
        Bump {{ .Target.Name }} from v{{ .CurrentVersion }} to v{{ .ExpectedVersion }}.
      username: "Abyssal"
      iconEmoji: ":robot_face:"
      channel: "#abyssal-notifications"
    - type: discord
      enabled: false
      webhook: "{{ .EnvironmentVariables.DISCORD_WEBHOOK }}"
      title: "[Abyssal] Bump {{ .Target.Name }} from v{{ .CurrentVersion }} to v{{ .ExpectedVersion }}"
      body: |
        Bump {{ .Target.Name }} from v{{ .CurrentVersion }} to v{{ .ExpectedVersion }}.
      username: "Abyssal"
      avatarURL: "https://avatars.githubusercontent.com/u/123456789?v=4"
    - type: email
      enabled: false
      smtpHost: "{{ .EnvironmentVariables.SMTP_HOST }}"
      smtpPort: "{{ .EnvironmentVariables.SMTP_PORT }}"
      smtpUser: "{{ .EnvironmentVariables.SMTP_USER }}"
      smtpPassword: "{{ .EnvironmentVariables.SMTP_PASSWORD }}"
      from: "{{ .EnvironmentVariables.SMTP_FROM }}"
    - type: jira
      enabled: false
      title: "[Abyssal] Bump {{ .Target.Name }} from v{{ .CurrentVersion }} to v{{ .ExpectedVersion }}"
      body: |
        Bump {{ .Target.Name }} from v{{ .CurrentVersion }} to v{{ .ExpectedVersion }}.
      jql: |
        project = "{{ .EnvironmentVariables.JIRA_PROJECT_KEY }}"
        AND issuetype = "{{ .EnvironmentVariables.JIRA_ISSUE_TYPE }}"
        AND reporter = currentuser()
      user: "{{ .EnvironmentVariables.JIRA_USERNAME }}"
      token: "{{ .EnvironmentVariables.JIRA_TOKEN }}"
      url: "{{ .EnvironmentVariables.JIRA_URL }}"
      project: "{{ .EnvironmentVariables.JIRA_PROJECT_KEY }}"
      board: "{{ .EnvironmentVariables.JIRA_BOARD_ID }}"
      issueType: "{{ .EnvironmentVariables.JIRA_ISSUE_TYPE }}"
      labels: ["abyssal"]
      payload: {}


providers:
  - type: argo-aoa # following the argo app of apps pattern
    directory: "./sample"
    selector: '.sample.applications'
